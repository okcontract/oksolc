name: Compiler verification

on:
  push:
    branches: [main]
    paths: ['lean/**', 'test/lean/**', 'examples/verification/**', 'src/**', 'build_support/**', 'build.zig*', '.zigversion', 'docs/**', '.github/workflows/verification.yml']
  pull_request:
    paths: ['lean/**', 'test/lean/**', 'examples/verification/**', 'src/**', 'build_support/**', 'build.zig*', '.zigversion', 'docs/**', '.github/workflows/verification.yml']
  workflow_dispatch:
    inputs:
      full_artifacts:
        description: Run all six artifact corpora plus the public preview
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: verification-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  verification:
    name: Proof library and regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false

      - name: Configure isolated build and evidence directories
        run: |
          verification_root="$RUNNER_TEMP/oksolc-verification"
          mkdir -p "$verification_root/evidence"
          printf '%s\n' \
            "ZIG_LOCAL_CACHE_DIR=$verification_root/zig-local" \
            "ZIG_GLOBAL_CACHE_DIR=$verification_root/zig-global" \
            "XDG_CACHE_HOME=$verification_root/xdg-cache" \
            "XDG_CONFIG_HOME=$verification_root/xdg-config" \
            "VERIFICATION_EVIDENCE=$verification_root/evidence" >> "$GITHUB_ENV"

      - name: Install pinned Lean
        run: |
          verification_tools="$RUNNER_TEMP/oksolc-verification-tools"
          mkdir -p "$verification_tools/lean"
          curl -fL --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.29.0/lean-4.29.0-linux.tar.zst \
            -o "$verification_tools/lean.tar.zst"
          printf '%s  %s\n' \
            089f7e513ed3e9436d191f4986330c0b53809c86b5997f5eb7f25550c374fa48 \
            "$verification_tools/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$verification_tools/lean.tar.zst" \
            --strip-components=1 -C "$verification_tools/lean"
          printf '%s\n' "$verification_tools/lean/bin" >> "$GITHUB_PATH"

      - name: Check inventory and Python regressions
        run: |
          python3 test/lean/check_verification_map.py --output "$VERIFICATION_EVIDENCE/inventory.json"
          python3 -m unittest discover -s test/lean -p 'test_*.py'

      - name: Test native proof observations
        run: |
          zig build fmt-check test-compiler-rewrites test-compiler-dispatch-trace \
            test-compiler-graph-export test-compiler-word-export \
            -Doptimize=Debug -j4 --summary all

      - name: Build all compiler proofs and attachment tests
        env:
          LEAN_NUM_THREADS: '2'
        run: |
          python3 test/lean/bounded_run.py --output "$VERIFICATION_EVIDENCE/models-process" \
            --rss-mib 8192 --timeout 3600 -- \
            bash -c 'cd lean && lake --quiet --rehash build Compiler'

      - name: Bind model receipt to this commit
        run: python3 test/lean/release_verification.py receipt --profile models --output "$VERIFICATION_EVIDENCE"

      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-verification-models-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oksolc-verification/evidence/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  artifacts:
    name: Certificates (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON((github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.full_artifacts)) && '["words","preview","graphs","graph_failures","functions","contracts","storage"]' || '["words","preview"]') }}
    env:
      LEAN_NUM_THREADS: '2'
      VERIFICATION_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false
      - name: Install pinned Lean and isolate caches
        run: |
          verification_root="$RUNNER_TEMP/oksolc-verification"
          mkdir -p "$verification_root/evidence" "$verification_root/lean"
          curl -fL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.29.0/lean-4.29.0-linux.tar.zst -o "$verification_root/lean.tar.zst"
          printf '%s  %s\n' 089f7e513ed3e9436d191f4986330c0b53809c86b5997f5eb7f25550c374fa48 "$verification_root/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$verification_root/lean.tar.zst" --strip-components=1 -C "$verification_root/lean"
          printf '%s\n' "$verification_root/lean/bin" >> "$GITHUB_PATH"
          printf '%s\n' \
            "ZIG_LOCAL_CACHE_DIR=$verification_root/zig-local" \
            "ZIG_GLOBAL_CACHE_DIR=$verification_root/zig-global" \
            "XDG_CACHE_HOME=$verification_root/xdg-cache" \
            "XDG_CONFIG_HOME=$verification_root/xdg-config" \
            "VERIFICATION_EVIDENCE=$verification_root/evidence" >> "$GITHUB_ENV"
      - name: Build the native artifact producer
        run: |
          case "$VERIFICATION_PROFILE" in
            words) target=build-compiler-word-export ;;
            graphs|graph_failures) target=build-compiler-graph-export ;;
            *) target=build-cli ;;
          esac
          zig build "$target" -Doptimize=ReleaseFast -j2
      - name: Certify all cases and reject semantic controls
        run: |
          checker="test/lean/check_compiler_$VERIFICATION_PROFILE.py"
          if [ "$VERIFICATION_PROFILE" = preview ]; then checker=test/lean/check_preview.py; fi
          python3 test/lean/bounded_run.py --output "$VERIFICATION_EVIDENCE/$VERIFICATION_PROFILE-process" \
            --rss-mib 8192 --timeout 3600 -- \
            python3 "$checker" --corpus --jobs 2 --output "$VERIFICATION_EVIDENCE/$VERIFICATION_PROFILE"
          python3 test/lean/release_verification.py receipt --profile "$VERIFICATION_PROFILE" --output "$VERIFICATION_EVIDENCE"
      - name: Retain certificate packages and failed diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-verification-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oksolc-verification/evidence/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  release-evidence:
    name: Attach complete evidence to the published release
    if: github.event_name == 'release'
    needs: [verification, artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download every successful profile
        run: |
          gh run download "$GITHUB_RUN_ID" \
            --pattern "compiler-verification-*-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --dir "$RUNNER_TEMP/verification-download"
      - name: Validate completeness and attach durable evidence
        run: |
          python3 test/lean/release_verification.py bundle \
            --input "$RUNNER_TEMP/verification-download" \
            --output "$RUNNER_TEMP/compiler-verification.tar.gz"
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/compiler-verification.tar.gz" \
            "$RUNNER_TEMP/compiler-verification.tar.gz.sha256"
