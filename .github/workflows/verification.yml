name: Compiler verification

on:
  push:
    branches: [main]
    paths:
      - 'lean/**'
      - 'test/lean/**'
      - 'examples/verification/**'
      - 'src/**'
      - 'build_support/**'
      - 'build.zig*'
      - '.zigversion'
      - 'docs/**'
      - '.github/workflows/verification.yml'
  pull_request:
    paths:
      - 'lean/**'
      - 'test/lean/**'
      - 'examples/verification/**'
      - 'src/**'
      - 'build_support/**'
      - 'build.zig*'
      - '.zigversion'
      - 'docs/**'
      - '.github/workflows/verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  verification:
    name: Lean kernel proofs and oksolc-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false

      - name: Configure isolated build directories
        run: |
          verification_root="$RUNNER_TEMP/oksolc-verification"
          mkdir -p "$verification_root"
          printf '%s\n' \
            "ZIG_LOCAL_CACHE_DIR=$verification_root/zig-local" \
            "ZIG_GLOBAL_CACHE_DIR=$verification_root/zig-global" \
            "XDG_CACHE_HOME=$verification_root/xdg-cache" \
            "XDG_CONFIG_HOME=$verification_root/xdg-config" >> "$GITHUB_ENV"

      - name: Install pinned Lean 4.29.0
        run: |
          verification_tools="$RUNNER_TEMP/oksolc-verification-tools"
          mkdir -p "$verification_tools/lean"
          curl -fL --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.29.0/lean-4.29.0-linux.tar.zst \
            -o "$verification_tools/lean.tar.zst"
          printf '%s  %s\n' \
            089f7e513ed3e9436d191f4986330c0b53809c86b5997f5eb7f25550c374fa48 \
            "$verification_tools/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$verification_tools/lean.tar.zst" \
            --strip-components=1 -C "$verification_tools/lean"
          printf '%s\n' "$verification_tools/lean/bin" >> "$GITHUB_PATH"

      - name: Build and test Zig compiler and verification adapters
        run: |
          zig build fmt-check lint \
            build-cli \
            build-compiler-rules-export \
            build-compiler-graph-export \
            build-compiler-word-export \
            test-compiler-graph-export \
            test-compiler-word-export \
            test-compiler-rewrites \
            -Doptimize=Debug -j2 --summary all

      - name: Check exported production rules match Lean Rules.lean
        run: ./zig-out/bin/compiler-rules-export | diff -u - lean/Compiler/Algebraic/Rules.lean

      - name: Build Lean proof libraries and oksolc-verify CLI
        working-directory: lean
        run: |
          lake --quiet --rehash build Contract Compiler oksolc-verify
          LEAN_PATH=.lake/build/lib/lean leanchecker --fresh Contract
          LEAN_PATH=.lake/build/lib/lean leanchecker --fresh Compiler

      - name: Run end-to-end verification corpus and negative controls
        run: python3 -m unittest discover -v -s test/lean -p 'test_*.py'
