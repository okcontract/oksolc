name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Zig version comes from build.zig.zon.
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false

      # Cache-enabled CLI tests need their configuration outside the checkout.
      # Set these after setup-zig, which exports its own Zig cache paths.
      - name: Configure test directories
        env:
          CI_CACHE_ROOT: ${{ runner.temp }}/oksolc-ci/test
        run: |
          printf '%s\n' \
            "ZIG_LOCAL_CACHE_DIR=$CI_CACHE_ROOT/local" \
            "ZIG_GLOBAL_CACHE_DIR=$CI_CACHE_ROOT/global" \
            "XDG_CACHE_HOME=$CI_CACHE_ROOT/xdg-cache" \
            "XDG_CONFIG_HOME=$CI_CACHE_ROOT/xdg-config" >> "$GITHUB_ENV"

      - name: Cache Zig builds
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.ZIG_LOCAL_CACHE_DIR }}
            ${{ env.ZIG_GLOBAL_CACHE_DIR }}
          key: zig-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.zigversion', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.zigversion', 'build.zig.zon') }}-

      - name: Install pinned browser toolchain
        run: npm install --global "typescript@$(cat src/cli/browser/typescript-version)" "bun@$(cat src/cli/browser/bun-version)"

      - name: Check formatting, lint, and browser validation
        run: |
          zig build fmt-check lint test-browser-types -Doptimize=ReleaseSafe -j2 --summary all
          bun test ./test/zig/cli/browser_build.test.js

      # The test step includes CLI smoke tests and the frozen compatibility corpus.
      - name: Run full ReleaseSafe suite
        run: zig build test -Doptimize=ReleaseSafe -j2 --summary all

      - name: Check ReleaseFast CLI, C ABI, and compiler output
        run: zig build cli-smoke libsolc-c-smoke compatibility-check -Doptimize=ReleaseFast -j2 --summary all
