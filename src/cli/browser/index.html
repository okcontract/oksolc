    <div class="document-heading"><div class="eyebrow" id="directory">PROJECT</div><h1 id="filename">Your compilation</h1></div>
    <div id="summary" class="summary">
      <button id="diagnostics-summary" class="summary-button" data-kind="diagnostic" hidden></button>
    </div>
    <div class="session-picker"><span class="live-dot" aria-hidden="true"></span><label class="sr-only" for="compilation">Compilation</label><select id="compilation"></select><button id="older" class="quiet" hidden>Older</button></div>
    <a id="download-output" class="button subtle" download="output.json">Export output <span aria-hidden="true">↗</span></a>
  </header>

  <div class="workspace">
    <aside class="sidebar" id="navigation" aria-label="Project navigation">
      <div class="sidebar-heading"><span class="eyebrow">EXPLORER</span><span class="count" id="file-count"></span></div>
      <div class="search-field"><span aria-hidden="true">⌕</span><label class="sr-only" for="search">Search project files, symbols and code</label><input id="search" type="search" placeholder="Search this project…" autocomplete="off" spellcheck="false"><kbd>/</kbd></div>
      <div class="nav-scroll"><nav id="tree" aria-label="Source files"></nav><div id="search-results" hidden></div></div>
      <div class="sidebar-footer"><span class="live-dot" aria-hidden="true"></span>Local session<span id="snapshot-origin"></span></div>
    </aside>

    <main id="main" tabindex="-1">
      <div class="document-toolbar">
        <nav class="tabs" aria-label="Compiler views">
          <button data-tab="source" aria-current="page">Source</button>
          <button data-tab="abi">ABI</button>
          <button data-tab="bytecode">Bytecode</button>
          <button data-tab="artifacts">Artifacts</button>
        </nav>
        <label class="sr-only" for="contract">Contract</label><select id="contract" aria-label="Contract"></select>
      </div>
      <div id="view-status" class="view-status" role="status" aria-live="polite"></div>
      <div id="live-bar" class="live-bar" hidden>
        <div class="live-heading"><span id="live-status" role="status" aria-live="polite"></span><div class="live-actions"><button id="workspace-live" class="quiet" hidden>Browse workspace</button><button id="follow-live" class="quiet" hidden>Follow latest</button></div></div>
        <div id="compilation-progress" class="compilation-progress" hidden>
          <progress id="live-progress" aria-label="Project compilation" aria-describedby="progress-item"></progress>
          <div class="progress-caption"><span id="progress-item"></span><span id="progress-count"></span></div>
        </div>
      </div>
      <div id="content" class="document-content"></div>
      <footer class="document-footer"><div class="source-position"><button id="line-position" popovertarget="line-jump" aria-label="Go to line" hidden></button><span id="position">Ready</span></div><div><a id="download-request" download="request.json">Request JSON</a><span class="dot-separator">·</span><span id="timestamp"></span></div></footer>
    </main>

    <aside class="inspector" aria-label="Source details">
      <div class="inspector-tabs" role="group" aria-label="Details view"><button data-panel="outline" aria-pressed="true">Outline</button><button data-panel="diagnostics" aria-pressed="false">Diagnostics</button><button data-panel="references" aria-pressed="false">References</button></div>
      <div id="details" class="inspector-content"></div>
    </aside>
  </div>
  <form id="line-jump" class="status-popover line-jump" popover="auto" role="dialog" aria-labelledby="line-jump-title">
    <div class="popover-heading"><h2 id="line-jump-title">Go to line</h2><button id="line-jump-close" type="button" class="quiet" aria-label="Close line navigation">×</button></div>
    <label for="line-number">Line number <span id="line-range" class="muted"></span></label>
    <div class="line-jump-controls"><input id="line-number" type="number" inputmode="numeric" min="1" step="1" required autofocus aria-label="Go to line" aria-describedby="line-range"><button type="submit" class="button">Go</button></div>
  </form>
  <div id="toast" role="alert" hidden></div>
  <noscript>This local source browser needs JavaScript. Compiler output remains available from oksolc standard-json.</noscript>
</body>
</html>
